name: eLibrary CI-CD

on:
  # ============================================================
  # AUTOMATIC DEPLOYMENT
  # ============================================================
  push:
    branches:
      - Dev
      - UAT
      - main

    paths:
      - 'eLibrary/**'


  # ============================================================
  # PR VALIDATION
  # ============================================================
  pull_request:
    branches:
      - Dev
      - UAT
      - main

    paths:
      - 'eLibrary/**'
      
  # ============================================================
  # MANUAL DEPLOYMENT
  # ============================================================
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - DEV
          - UAT
          - PROD

permissions:
  contents: read
  pull-requests: read

env:
  DOTNET_VERSION: "6.0.x"
  CONFIGURATION: Release
  PROJECT_PATH: eLibrary/eLibrary.csproj

  # ============================================================ 
  # BLOB ARTIFACT CONFIGURATION 
  # Configure these as GitHub Environment Variables 
  # for DEV/UAT/PROD or repository variables. 
  # ============================================================ 
  ARTIFACT_MODULE: eLibrary

jobs:

  # ============================================================
  # BUILD
  # ============================================================
  build:
    name: Build eLibrary
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      # ========================================================
      # VALIDATE BRANCH AND ENVIRONMENT 
      # ========================================================
      - name: Validate Branch and Environment
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          branch="${GITHUB_REF_NAME}"
          environment="${{ inputs.environment }}"

          echo "Branch      : $branch"
          echo "Environment : $environment"

          if [[ "$environment" == "DEV" && "$branch" != "Dev" ]]; then
            echo "DEV deployments must use the Dev branch."
            exit 1
          fi

          if [[ "$environment" == "UAT" && "$branch" != "UAT" ]]; then
            echo "UAT deployments must use the UAT branch."
            exit 1
          fi

          if [[ "$environment" == "PROD" && "$branch" != "main" ]]; then
            echo "PROD deployments must use the main branch."
            exit 1
          fi

      # ======================================================== 
      # SETUP .NET 
      # ========================================================
      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Display .NET information
        run: dotnet --info

      # ======================================================== 
      # RESTORE 
      # ========================================================
      - name: Restore projects
        run: dotnet restore ADIBSolution.sln

      # ======================================================== 
      # BUILD 
      # ========================================================
      - name: Build eLibrary
        run: |
          dotnet build ${{env.PROJECT_PATH}} \
            --configuration ${{env.CONFIGURATION}} \
            --no-restore

      # ========================================================
      # PUBLISH
      # Only publish for push/manual.
      # PR only performs build validation.
      # ========================================================
      - name: Publish eLibrary
        if: github.event_name != 'pull_request'
        run: |
          rm -rf ./publish/elibrary

          dotnet publish ${{env.PROJECT_PATH}} \
            --configuration ${{ env.CONFIGURATION }} \
            --no-build \
            --output ./publish/eLibrary

      # # ======================================================== 
      # # VERIFY PACKAGE 
      # # ========================================================
      # - name: Verify Packages
      #   if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      #   shell: bash
      #   run: |
      #     echo "========================================="
      #     echo "Published Packages"
      #     echo "========================================="

      #     if [ ! -d "./publish/eLibrary" ]; then
      #       echo "ERROR: eLibrary packages was not created."
      #       exit 1
      #     fi

      #     find ./publish -maxdepth 2 -type f -print | sed -n '1,50p'
      #     if [ -z "$(find ./publish/eLibrary -type f -print -quit)" ]; then
      #       echo "ERROR: eLibrary packages is empty"
      #       exit 1
      #     fi

      # ======================================================== 
      # CREATE ZIP PACKAGE 
      # 
      # This ZIP is used both for: 
      # 1. Current deployment 
      # 2. Blob Storage backup after successful deployment 
      # ========================================================
      - name: Create deployment ZIP
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p ./package
          cd ./publish/eLibrary
          zip -r ../../package/elibrary-package.zip .
          
      # ======================================================== 
      # UPLOAD ARTIFACT FOR DEPLOYMENT JOB
      # ========================================================
      - name: Upload Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: elibrary-package
          path: ./package/elibrary-package.zip
          if-no-files-found: error
          retention-days: 10

  # ============================================================
  # DEV
  # ============================================================
  deploy-dev:
    name: Deploy eLibrary to DEV
    needs: build

    if: |
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/Dev') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.environment == 'DEV')

    runs-on: ubuntu-latest

    environment:
      name: DEV

    steps:

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: elibrary-package
          path: ./package

      # ======================================================== 
      # AZURE LOGIN USING SERVICE PRINCIPAL + CLIENT SECRET 
      # ========================================================
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ======================================================== 
      # DEPLOY         
      # ========================================================
      - name: Deploy eLibrary
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.ELIBRARY_APP_NAME }}
          package: ./package/elibrary-package.zip

      # ======================================================== 
      # CHECK APPLICATION HEALTH
      # ========================================================
      - name: Check application health
        shell: bash
        env:
          HEALTH_URL: ${{ vars.ELIBRARY_HEALTHCHECK_URL }}
        run: |
          test -n "$HEALTH_URL" || {
            echo "ELIBRARY_HEALTHCHECK_URL is not configured."
            exit 1
          }

          for attempt in {1..12}; do
            if curl --fail --silent --show-error \
              --max-time 10 "$HEALTH_URL"; then
              echo "Health check passed."
              exit 0
            fi
            echo "Health check attempt $attempt failed."
            sleep 10
          done

          echo "Health check failed."
          exit 1

      # ======================================================== 
      # SAVE SUCCESSFUL PACKAGE TO BLOB
      # ========================================================
      - name: Save successful package to Blob
        shell: bash
        run: |
          set -euo pipefail
          printf -v RUN_NUMBER "%08d" "$GITHUB_RUN_NUMBER"
          PACKAGE_NAME="build-${RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.zip"
          BLOB_PATH="eLibrary/dev"
          
          az storage blob upload \
            --account-name "${{ vars.ARTIFACT_CONTAINER }}" \
            --container-name "${{ vars.ARTIFACT_CONTAINER }}" \
            --name "$BLOB_PATH/$PACKAGE_NAME" \
            --file ./package/elibrary-package.zip \
            --auth-mode login \
            --overwrite false
          
          printf '%s' "$PACKAGE_NAME" > latest-successful.txt

          az storage blob upload \
            --account-name "${{ vars.ARTIFACT_CONTAINER }}" \
            --container-name "${{ vars.ARTIFACT_CONTAINER }}" \
            --name "$BLOB_PATH/latest-successful.txt" \
            --file latest-successful.txt \
            --auth-mode login \
            --overwrite true

  # ============================================================
  # UAT
  # ============================================================
  deploy-uat:
    name: Deploy eLibrary to UAT
    needs: build

    if: |
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/UAT') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.environment == 'UAT')

    runs-on: ubuntu-latest

    environment:
      name: UAT

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: elibrary-package
          path: ./package

      # ======================================================== 
      # AZURE LOGIN USING SERVICE PRINCIPAL + CLIENT SECRET 
      # ========================================================
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ======================================================== 
      # DEPLOY         
      # ========================================================
      - name: Deploy eLibrary
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.ELIBRARY_APP_NAME }}
          package: ./package/elibrary-package.zip

      # ======================================================== 
      # CHECK APPLICATION HEALTH
      # ========================================================
      - name: Check application health
        shell: bash
        env:
          HEALTH_URL: ${{ vars.ELIBRARY_HEALTHCHECK_URL }}
        run: |
          test -n "$HEALTH_URL" || {
            echo "ELIBRARY_HEALTHCHECK_URL is not configured."
            exit 1
          }

          for attempt in {1..12}; do
            if curl --fail --silent --show-error \
              --max-time 10 "$HEALTH_URL"; then
              echo "Health check passed."
              exit 0
            fi
            echo "Health check attempt $attempt failed."
            sleep 10
          done

          echo "Health check failed."
          exit 1

      # ======================================================== 
      # SAVE SUCCESSFUL PACKAGE TO BLOB
      # ========================================================
      - name: Save successful package to Blob
        shell: bash
        run: |
          set -euo pipefail
          printf -v RUN_NUMBER "%08d" "$GITHUB_RUN_NUMBER"
          PACKAGE_NAME="build-${RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.zip"
          BLOB_PATH="eLibrary/uat"
          
          az storage blob upload \
            --account-name "${{ vars.ARTIFACT_STORAGE_ACCOUNT }}" \
            --container-name "${{ vars.ARTIFACT_CONTAINER }}" \
            --name "$BLOB_PATH/$PACKAGE_NAME" \
            --file ./package/elibrary-package.zip \
            --auth-mode login \
            --overwrite false
          
          printf '%s' "$PACKAGE_NAME" > latest-successful.txt

          az storage blob upload \
            --account-name "${{ vars.ARTIFACT_STORAGE_ACCOUNT }}" \
            --container-name "${{ vars.ARTIFACT_CONTAINER }}" \
            --name "$BLOB_PATH/latest-successful.txt" \
            --file latest-successful.txt \
            --auth-mode login \
            --overwrite true

  # ============================================================
  # PROD
  # ============================================================
  deploy-prod:
    name: Deploy eLibrary to PROD
    needs: build

    if: |
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.environment == 'PROD')

    runs-on: ubuntu-latest

    environment:
      name: PROD

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: elibrary-package
          path: ./package

      # ======================================================== 
      # AZURE LOGIN USING SERVICE PRINCIPAL + CLIENT SECRET 
      # ========================================================
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ======================================================== 
      # DEPLOY         
      # ========================================================
      - name: Deploy eLibrary
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.ELIBRARY_APP_NAME }}
          package: ./package/elibrary-package.zip
      
      # ======================================================== 
      # CHECK APPLICATION HEALTH
      # ========================================================
      - name: Check application health
        shell: bash
        env:
          HEALTH_URL: ${{ vars.ELIBRARY_HEALTHCHECK_URL }}
        run: |
          test -n "$HEALTH_URL" || {
            echo "ELIBRARY_HEALTHCHECK_URL is not configured."
            exit 1
          }

          for attempt in {1..12}; do
            if curl --fail --silent --show-error \
              --max-time 10 "$HEALTH_URL"; then
              echo "Health check passed."
              exit 0
            fi
            echo "Health check attempt $attempt failed."
            sleep 10
          done

          echo "Health check failed."
          exit 1

      # ======================================================== 
      # SAVE SUCCESSFUL PACKAGE TO BLOB
      # ========================================================
      - name: Save successful package to Blob
        shell: bash
        run: |
          set -euo pipefail
          printf -v RUN_NUMBER "%08d" "$GITHUB_RUN_NUMBER"
          PACKAGE_NAME="build-${RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.zip"
          BLOB_PATH="eLibrary/prod"
          
          az storage blob upload \
            --account-name "${{ vars.ARTIFACT_STORAGE_ACCOUNT }}" \
            --container-name "${{ vars.ARTIFACT_CONTAINER }}" \
            --name "$BLOB_PATH/$PACKAGE_NAME" \
            --file ./package/elibrary-package.zip \
            --auth-mode login \
            --overwrite false
          
          printf '%s' "$PACKAGE_NAME" > latest-successful.txt

          az storage blob upload \
            --account-name "${{ vars.ARTIFACT_STORAGE_ACCOUNT }}" \
            --container-name "${{ vars.ARTIFACT_CONTAINER }}" \
            --name "$BLOB_PATH/latest-successful.txt" \
            --file latest-successful.txt \
            --auth-mode login \
            --overwrite true
