name: Almasdar Ci-CD

on:
  push:
    branches:
      - Dev
      - UAT
      - main

  pull_request:
    branches:
      - Dev
      - UAT
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - DEV
          - UAT
          - PROD

      deploy_module:
        description: "Select module to deploy"
        required: true
        type: choice
        options:
          - eLibrary
          - UserManagement
          - All

permissions:
  contents: read
  pull-requests: read
  id-token: write

env:
  DOTNET_VERSION: "6.0.x"
  CONFIGURATION: Release

jobs:
  detect-changes:
    name: Detect Changed Modules
    runs-on: ubuntu-latest

    outputs:
      elibrary: ${{ steps.filter.outputs.elibrary }}
      usermanagement: ${{ steps.filter.outputs.usermanagement }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changed Modules
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            elibrary:
              - 'eLibrary/**'
              - 'Common/eLibrary/**'
            usermanagement:
              - 'UserManagement/**'
              - 'Common/UserManagement/**'

  build:
    name: Build ${{matrix.module}}
    needs: detect-changes
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - module: eLibrary
          - module: UserManagement
          
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate selected modules
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ -z "${{ inputs.deploy_module }}" || "${{ inputs.deploy_module }}" == "null" ]]; then
            echo "ERROR: Select a module to deploy."
            exit 1
          fi

      - name: Validate Branch and Environment
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          branch="${GITHUB_REF_NAME}"
          environment="${{ inputs.environment }}"

          echo "Branch      : $branch"
          echo "Environment : $environment"

          if [[ "$environment" == "DEV" && "$branch" != "Dev" ]]; then
            echo "DEV deployments must use the Dev branch."
            exit 1
          fi

          if [[ "$environment" == "UAT" && "$branch" != "UAT" ]]; then
            echo "UAT deployments must use the UAT branch."
            exit 1
          fi

          if [[ "$environment" == "PROD" && "$branch" != "main" ]]; then
            echo "PROD deployments must use the main branch."
            exit 1
          fi

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Display .NET information
        run: dotnet --info

      - name: Restore projects
        run: dotnet restore ADIBSolution.sln

      - name: Build ${{ matrix.module }}
        if: >-
          ${{
            (matrix.module == 'eLibrary' &&
             needs.detect-changes.outputs.elibrary == 'true')
            ||
            (matrix.module == 'UserManagement' &&
             needs.detect-changes.outputs.usermanagement == 'true')
            ||
            (github.event_name == 'workflow_dispatch' &&
             (
               (matrix.module == 'eLibrary' &&
                inputs.deploy_elibrary == true)
               ||
               (matrix.module == 'UserManagement' &&
                inputs.deploy_usermanagement == true)
             ))
          }}
        run: |
          if [ "${{ matrix.module }}" = "eLibrary" ]; then
          dotnet build eLibrary/eLibrary.csproj \
            --configuration "${{ env.CONFIGURATION }}" \
            --no-restore
          else
            dotnet build UserManagement/UserManagement.csproj \
              --configuration "${{ env.CONFIGURATION }}" \
              --no-restore
          fi

      - name: Publish ${{ matrix.module }}
        if: >-
          ${{
            (github.event_name == 'push' &&
             (
               (matrix.module == 'eLibrary' &&
                needs.detect-changes.outputs.elibrary == 'true')
               ||
               (matrix.module == 'UserManagement' &&
                needs.detect-changes.outputs.usermanagement == 'true')
             ))
            ||
            (github.event_name == 'workflow_dispatch' &&
             (
               (matrix.module == 'eLibrary' &&
                inputs.deploy_elibrary == true)
               ||
               (matrix.module == 'UserManagement' &&
                inputs.deploy_usermanagement == true)
             ))
          }}
        run: |
          dotnet publish ${{ matrix.module }}/${{ matrix.module }}.csproj \
            --configuration ${{ env.CONFIGURATION }} \
            --no-build \
            --output ./publish/${{ matrix.module }}

      - name: Verify Deployment Packages for ${{ matrix.module }}
        if: ${{ (github.event_name == 'push' && matrix.module == 'eLibrary' && needs.detect-changes.outputs.elibrary == 'true') || (github.event_name == 'push' && matrix.module == 'UserManagement' && needs.detect-changes.outputs.usermanagement == 'true') || (github.event_name == 'workflow_dispatch' && ((matrix.module == 'eLibrary' && inputs.deploy_elibrary == true) || (matrix.module == 'UserManagement' && inputs.deploy_usermanagement == true))) }}
        shell: bash
        run: |
          echo "========================================="
          echo "Published Packages: ${{ matrix.module }}"
          echo "========================================="

          PACKAGE_PATH="./publish/${{ matrix.module }}"

          if [ ! -d "$PACKAGE_PATH" ]; then
            echo "ERROR: $PACKAGE_PATH directory does not exist."
            exit 1
          fi

          find $PACKAGE_PATH -maxdepth 2 -type f -print | sed -n '1,50p'
          if [ -z "$(find $PACKAGE_PATH -type f -print -quit)" ]; then
            echo "ERROR: No deployment packages were generated for ${{ matrix.module }}.."
            exit 1
          fi

      - name: Upload ${{ matrix.module }} artifact
        if: >-
          ${{
            (github.event_name == 'push' &&
             (
               (matrix.module == 'eLibrary' &&
                needs.detect-changes.outputs.elibrary == 'true')
               ||
               (matrix.module == 'UserManagement' &&
                needs.detect-changes.outputs.usermanagement == 'true')
             ))
            ||
            (github.event_name == 'workflow_dispatch' &&
             (
               (matrix.module == 'eLibrary' &&
                inputs.deploy_elibrary == true)
               ||
               (matrix.module == 'UserManagement' &&
                inputs.deploy_usermanagement == true)
             ))
          }}
        uses: actions/upload-artifact@v4
        with:
          name: adib-api-packages
          path: ./publish
          if-no-files-found: error
          retention-days: 10

  deploy-dev:
    name: Deploy to DEV

    if: >
      (github.event_name == 'push' &&
      github.ref == 'refs/heads/Dev' &&
      (needs.detect-changes.outputs.elibrary == 'true' || needs.detect-changes.outputs.usermanagement == 'true'))
      || (github.event_name == 'workflow_dispatch' &&
      inputs.environment == 'DEV' &&
      (inputs.deploy_module == 'eLibrary' || inputs.deploy_module == 'UserManagement' || inputs.deploy_module == 'All'))
    needs:
      - detect-changes
      - build

    runs-on: ubuntu-latest

    environment:
      name: DEV

    steps:
      - name: Download Deployment Artifact
        uses: actions/download-artifact@v4
        with:
          name: adib-api-packages
          path: ./publish

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy eLibrary
        if: >
          needs.detect-changes.outputs.elibrary == 'true'
          || (github.event_name == 'workflow_dispatch'
              && (inputs.deploy_module == 'eLibrary' || inputs.deploy_module == 'All'))
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.ELIBRARY_APP_NAME }}
          package: ./publish/eLibrary

      - name: Deploy UserManagement
        if: >
          needs.detect-changes.outputs.usermanagement == 'true'
          || (github.event_name == 'workflow_dispatch'
              && (inputs.deploy_module == 'UserManagement' || inputs.deploy_module == 'All'))
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.USERMANAGEMENT_APP_NAME }}
          package: ./publish/UserManagement

  deploy-uat:
    name: Deploy to UAT

    if: >
      (github.event_name == 'push' &&
      github.ref == 'refs/heads/UAT' &&
      (needs.detect-changes.outputs.elibrary == 'true' || needs.detect-changes.outputs.usermanagement == 'true'))
      || (github.event_name == 'workflow_dispatch' &&
      inputs.environment == 'UAT' &&
      (inputs.deploy_module == 'eLibrary' || inputs.deploy_module == 'UserManagement' || inputs.deploy_module == 'All'))
    needs:
      - detect-changes
      - build

    runs-on: ubuntu-latest

    environment:
      name: UAT

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: adib-api-packages
          path: ./publish

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy eLibrary
        if: >
          needs.detect-changes.outputs.elibrary == 'true'
          || (github.event_name == 'workflow_dispatch'
              && (inputs.deploy_module == 'eLibrary' || inputs.deploy_module == 'All'))
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.ELIBRARY_APP_NAME }}
          package: ./publish/eLibrary

      - name: Deploy UserManagement
        if: >
          needs.detect-changes.outputs.usermanagement == 'true'
          || (github.event_name == 'workflow_dispatch'
              && (inputs.deploy_module == 'UserManagement' || inputs.deploy_module == 'All'))
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.USERMANAGEMENT_APP_NAME }}
          package: ./publish/UserManagement

  deploy-prod:
    name: Deploy to PROD

    if: >
      (github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.detect-changes.outputs.elibrary == 'true' || needs.detect-changes.outputs.usermanagement == 'true'))
      || (github.event_name == 'workflow_dispatch' &&
      inputs.environment == 'PROD' &&
      (inputs.deploy_module == 'eLibrary' || inputs.deploy_module == 'UserManagement' || inputs.deploy_module == 'All'))
    needs:
      - detect-changes
      - build

    runs-on: ubuntu-latest

    environment:
      name: PROD

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: adib-api-packages
          path: ./publish

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy eLibrary
        if: >
          needs.detect-changes.outputs.elibrary == 'true'
          || (github.event_name == 'workflow_dispatch'
              && (inputs.deploy_module == 'eLibrary' || inputs.deploy_module == 'All'))
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.ELIBRARY_APP_NAME }}
          package: ./publish/eLibrary

      - name: Deploy UserManagement
        if: >
          needs.detect-changes.outputs.usermanagement == 'true'
          || (github.event_name == 'workflow_dispatch'
              && (inputs.deploy_module == 'UserManagement' || inputs.deploy_module == 'All'))
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.USERMANAGEMENT_APP_NAME }}
          package: ./publish/UserManagement
